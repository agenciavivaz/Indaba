<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap"><title>StageBadge — Indaba</title></head>
<body>
<div id="root"></div>
<script>
var I = window.Indaba, h = React.createElement;
var S = ['alvo', 'aquecendo', 'engajada', 'em_cadencia', 'conversa', 'reuniao_agendada', 'reuniao_realizada', 'nutricao', 'descartada'];
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ib-demo' },
  h('div', { className: 'ib-row' }, S.map(function (s) { return h(I.StageBadge, { key: s, stage: s }); })),
  h('div', { className: 'ib-row' }, h(I.StageBadge, { stage: 'engajada', days: 3 }), h(I.StageBadge, { stage: 'em_cadencia', days: 12 }))));
</script>
</body>
</html>

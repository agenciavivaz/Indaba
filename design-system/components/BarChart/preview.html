<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap"><title>BarChart — Indaba</title></head>
<body>
<div id="root"></div>
<script>
var I = window.Indaba, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ib-demo', style: { maxWidth: 620 } },
  h(I.BarChart, { title: 'Pontos por origem', unit: '%', max: 100, threshold: 80, thresholdLabel: 'Alerta quando uma origem passa de 80% dos pontos',
    data: [{ label: 'LinkedIn Ads', value: 86 }, { label: 'Missões', value: 9 }, { label: 'Link pessoal', value: 3 }, { label: 'Apollo', value: 2 }] }),
  h(I.BarChart, { title: 'Contas por temperatura', data: [{ label: 'Fria', value: 52 }, { label: 'Engajada', value: 9, highlight: true }, { label: 'Quente', value: 3, highlight: true }] })));
</script>
</body>
</html>

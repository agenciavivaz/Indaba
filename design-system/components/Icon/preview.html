<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap"><title>Icon — Indaba</title></head>
<body>
<div id="root"></div>
<script>
var I = window.Indaba, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ib-demo' },
  h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(104px, 1fr))', gap: 8 } }, I.Icon.names.map(function (n) {
    return h('div', { key: n, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, padding: 10, border: '1px solid var(--relevo)', borderRadius: 'var(--radius-sm)' } }, h(I.Icon, { name: n, size: 20 }), h('span', { style: { fontSize: 12, lineHeight: '16px', color: 'var(--ink-muted)' } }, n));
  }))));
</script>
</body>
</html>

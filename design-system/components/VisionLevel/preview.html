<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap"><title>VisionLevel — Indaba</title></head>
<body>
<div id="root"></div>
<script>
var I = window.Indaba, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ib-demo' },
  h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: 20 } },
    [0, 1, 2, 3, 4, 5].map(function (l) { return h(I.VisionLevel, { key: l, level: l, source: 'LinkedIn Ads, relatório de 28/10/2026' }); })),
  h('p', { className: 'ib-demo-cap' }, 'Compacto, para linhas e nós'),
  h('div', { className: 'ib-row' }, h(I.VisionLevel, { level: 2, compact: true }), h(I.VisionLevel, { level: 4, compact: true }))));
</script>

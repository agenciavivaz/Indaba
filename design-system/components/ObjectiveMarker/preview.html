<!-- @dsCard group="Mapa" height=300 subtitle="Conquistado, pendente ou perdido" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap"><title>ObjectiveMarker — Indaba</title></head>
<body>
<div id="root"></div>
<script>
var I = window.Indaba, h = React.createElement;
function Demo() {
  var s = React.useState(false);
  return h('div', { className: 'ib-demo' },
    h('div', { className: 'ib-demo-row' },
      h(I.ObjectiveMarker, { state: 'conquistado', label: 'Comitê mapeado', date: '21/10/2026' }),
      h(I.ObjectiveMarker, { state: 'pendente', label: 'Decisor alcançado' }),
      h(I.ObjectiveMarker, { state: 'perdido', label: 'Visão estabelecida', date: '12/10/2026' })),
    h('p', { className: 'ib-demo-cap' }, 'Faixa compacta do cabeçalho da conta'),
    h('div', { className: 'ib-row' }, ['Comitê mapeado', 'Visão estabelecida', 'Decisor alcançado', 'Braço erguido', 'Reunião'].map(function (l, i) {
      return h(I.ObjectiveMarker, { key: l, compact: true, label: l, state: i < 2 || (i === 2 && s[0]) ? 'conquistado' : 'pendente', justAchieved: i === 2 && s[0] });
    })),
    h('div', null, h(I.Button, { size: 'sm', onClick: function () { s[1](!s[0]); } }, s[0] ? 'Desfazer' : 'Simular: decisor alcançado')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>

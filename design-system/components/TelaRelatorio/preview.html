<!doctype html>

<div id="root"></div>

var I = window.Indaba, h = React.createElement;
function Nav(active) {

    h('div', { className: 'ib-nav__foot' }, h('div', { style: { color: 'var(--ink)', fontWeight: 600 } }, 'Montadoras BR'), h('div', null, 'Workspace Exemplo 3D')));

          { label: 'Respostas', value: '4', delta: { value: '+3', direction: 'up', good: true } },

          { label: 'No prazo', value: '71%', delta: { value: '+22 p.p.', direction: 'up', good: true } },

        h('section', { className: 'ib-panel', style: { padding: 20, display: 'flex', flexDirection: 'column', gap: 20 } },

              return h('div', { key: i, style: { display: 'grid', gridTemplateColumns: 'minmax(0, 1fr) auto auto', gap: 12, alignItems: 'center', padding: '8px 0', borderTop: '1px solid var(--relevo)' } },

            }))),

          h('div', null, h('p', { style: { margin: '0 0 6px', fontWeight: 600 } }, 'Destaques'), h('ul', { className: 'ib-reasons' }, h('li', null, 'Missões no prazo subiram de 49% para 71%.'), h('li', null, 'Primeiro braço erguido do programa, na Vale do Aço.'), h('li', null, 'Duas janelas abertas viraram ofensiva em até 2 dias úteis.'))),

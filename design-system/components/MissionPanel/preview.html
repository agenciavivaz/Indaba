<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap"><title>MissionPanel — Indaba</title></head>
<body>
<div id="root"></div>
<script>
var I = window.Indaba, h = React.createElement;
var M = {
  title: 'Mensagem depois do aceite', channel: 'linkedin', step: 'D3', due: 'Hoje até 18h',
  person: { name: 'Renata Ilha', title: 'Gerente de Produto, influenciadora' },
  account: { name: 'Ferronorte Máquinas', tier: 2 },
  why: ['Aceitou o convite ontem às 16h.', 'Reagiu ao post do especialista sobre configuradores em 22/10.', 'Passo 3 da cadência da trilha "sem configurador".'],
  instruction: 'Agradeça o aceite e conecte com o post que ela curtiu. Uma pergunta só, sem oferta.',
  draft: { body: 'Renata, obrigado por aceitar. Vi que você curtiu o post sobre configuradores de implementos. Hoje o cliente de vocês monta a configuração no site ou ainda depende do vendedor?' },
  shortcut: { href: 'https://www.linkedin.com/in/exemplo', value: 'linkedin.com/in/renata-ilha-exemplo' }
};
function Demo() {
  var o = React.useState(null);
  return h('div', { className: 'ib-demo' }, h(I.MissionPanel, { mission: M, outcome: o[0], onOutcome: function (v) { o[1](v); }, onUndo: function () { o[1](null); }, onClose: function () {} }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
